name: Build TR3600

# 在 fork 的 agent/cudy-tr3600-v1-6.12 分支上手动触发
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/cudy-tr3600-v1-6.12

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            python3-pyelftools libpython3-dev

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Apply config
        run: make defconfig

      - name: Download sources
        run: make download -j$(nproc) V=s

      - name: Build firmware
        run: make -j$(nproc) V=s

      - name: Upload sysupgrade image
        uses: actions/upload-artifact@v4
        with:
          name: cudy-tr3600-v1-sysupgrade
          path: bin/targets/mediatek/filogic/*squashfs-sysupgrade.bin
          if-no-files-found: error
