name: Build TR3600

# 在 fork 的 agent/cudy-tr3600-v1-6.12 分支上手动触发
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/cudy-tr3600-v1-6.12

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            python3-pyelftools libpython3-dev squashfs-tools

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Remove deprecated firewall3
        run: |
          rm -rf package/network/config/firewall
          echo "=== after rm ==="
          ls package/network/config/ | grep -i firewall || echo "no firewall dirs"
          echo "=== PROVIDES check ==="
          grep -r "PROVIDES:=uci-firewall" package/ feeds/ 2>/dev/null | head -5 || echo "none found"

      - name: Apply config
        run: make defconfig

      - name: Diagnose luci-light
        run: |
          echo "=== .config values ==="
          grep -E "CONFIG_PACKAGE_luci-light|CONFIG_PACKAGE_luci-base|CONFIG_PACKAGE_luci-app-firewall|CONFIG_IPV6" .config || echo "none found"
          echo "=== dependency check ==="
          for p in rpcd rpcd-mod-file rpcd-mod-luci rpcd-mod-ucode cgi-io ucode ucode-mod-fs ucode-mod-log ucode-mod-uci ucode-mod-ubus; do
            c=$(grep -c "config PACKAGE_$p$" tmp/.config-package.in 2>/dev/null || echo 0)
            echo "$p: kconfig_definitions=$c"
          done
          echo "=== luci-base kconfig ==="
          grep -A15 "^config PACKAGE_luci-base$" tmp/.config-package.in | head -20
          echo "=== 1. feeds/luci.index ==="
          grep -c "luci-light" feeds/luci.index 2>/dev/null || echo "not in index"
          echo "=== 2. tmp/.packageinfo ==="
          ls -la tmp/.packageinfo 2>/dev/null || echo "no packageinfo"
          grep -c "^Package: luci-light$" tmp/.packageinfo 2>/dev/null || echo "not in packageinfo"
          echo "=== 3. tmp/.config-package.in ==="
          grep -c "config PACKAGE_luci-light" tmp/.config-package.in 2>/dev/null || echo "not in kconfig"
          echo "=== 4. luci-light definition ==="
          grep -B1 -A10 "PACKAGE_luci-light$" tmp/.config-package.in 2>/dev/null | head -25 || echo "no definition"
          echo "=== 5. any < syntax ==="
          grep -c "PACKAGE_.*<PACKAGE_" tmp/.config-package.in 2>/dev/null || echo "no < syntax"

      - name: Download sources
        run: make download -j$(nproc) V=s

      - name: Build firmware
        run: make -j$(nproc) V=s

      - name: Verify LuCI in image
        run: |
          IMG=$(ls bin/targets/mediatek/filogic/*squashfs-sysupgrade.bin | head -1)
          mkdir -p /tmp/imgcheck && tar -xf "$IMG" -C /tmp/imgcheck
          ROOTFS=$(find /tmp/imgcheck -name root | head -1)
          unsquashfs -l "$ROOTFS" | grep -q "usr/sbin/uhttpd" || (echo "ERROR: uhttpd missing from image!" && exit 1)
          unsquashfs -l "$ROOTFS" | grep -q "www/cgi-bin/luci" || (echo "ERROR: LuCI web files missing from image!" && exit 1)
          echo "image OK"

      - name: Upload sysupgrade image
        uses: actions/upload-artifact@v4
        with:
          name: cudy-tr3600-v1-sysupgrade
          path: bin/targets/mediatek/filogic/*squashfs-sysupgrade.bin
          if-no-files-found: error
