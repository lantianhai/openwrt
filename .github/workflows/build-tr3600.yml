name: Build TR3600


# 在 fork 的 agent/cudy-tr3600-v1-6.12 分支上手动触发
on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-24.04


    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/cudy-tr3600-v1-6.12


      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          df -h


      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            python3-pyelftools libpython3-dev squashfs-tools


      - name: Update feeds
        run: ./scripts/feeds update -a


      - name: Install feeds
        run: ./scripts/feeds install -a


      - name: Remove deprecated firewall3
        run: rm -rf package/network/config/firewall


      - name: Verify feeds installed
        run: |
          for f in packages luci; do
            if [ ! -d "feeds/$f" ] || [ -z "$(ls feeds/$f)" ]; then
              echo "ERROR: feed $f not installed!"
              exit 1
            fi
          done
          echo "feeds OK"


      - name: Apply config
        run: make defconfig


      - name: Verify config kept LuCI
        run: |
          echo "=== tmp/.config-package.in ==="
          ls -la tmp/.config-package.in 2>/dev/null || echo "FILE MISSING"
          echo "--- PACKAGE_luci matches ---"
          grep -c "PACKAGE_luci" tmp/.config-package.in 2>/dev/null || echo "0 matches"
          echo "--- luci package definition ---"
          grep -B2 -A8 "config PACKAGE_luci$" tmp/.config-package.in 2>/dev/null | head -20 || echo "not found with tab pattern"
          grep -B2 -A8 "PACKAGE_luci$" tmp/.config-package.in 2>/dev/null | head -20 || echo "not found broad"
          echo "--- firewall4 definition for comparison ---"
          grep -B2 -A5 "config PACKAGE_firewall4$" tmp/.config-package.in 2>/dev/null | head -12 || echo "firewall4 not found"
          echo "=== .config summary ==="
          grep -c "=y" .config
          grep "^CONFIG_PACKAGE_luci=y" .config || echo "luci NOT =y"
          grep "^CONFIG_PACKAGE_uhttpd=y" .config || echo "uhttpd NOT =y"
          grep "^CONFIG_PACKAGE_firewall4=y" .config || echo "firewall4 NOT =y"
